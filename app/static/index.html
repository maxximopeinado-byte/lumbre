<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lumbre</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icono-192.png">
<link rel="apple-touch-icon" href="/static/icono-192.png">
<style>
/* Una mesa de lectura: papel de lino, tonos topo y marcapáginas en pastel. Barra lateral en escritorio, pestañas abajo en el móvil. */
@font-face{font-family:"Newsreader";src:url(/static/fuentes/newsreader-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Newsreader";src:url(/static/fuentes/newsreader-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Newsreader";src:url(/static/fuentes/newsreader-latin-400-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"Figtree";src:url(/static/fuentes/figtree-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Figtree";src:url(/static/fuentes/figtree-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Figtree";src:url(/static/fuentes/figtree-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
:root{
  color-scheme:light;
  --lino:#f4efe8;--papel:#fbf8f3;--avena:#e9e1d7;--topo-claro:#cfc4b8;--topo:#8f8074;--topo-hondo:#5f5248;--cafe:#3b312a;--suave:#6f6358;
  --salvia:#d7e0d0;--salvia-t:#4c5f49;--rubor:#efd9d4;--rubor-t:#80504a;--cielo:#d6e1e6;--cielo-t:#435c68;--mantequilla:#f2e7c9;--mantequilla-t:#6d5a26;--lavanda:#ded8e6;--lavanda-t:#5a4f6e;
  --boton-t:#fbf8f3;--sombra:0 1px 2px rgba(95,82,72,.06),0 12px 32px -20px rgba(95,82,72,.3);
  --display:"Newsreader",Georgia,"Times New Roman",serif;--texto:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --lino:#272220;--papel:#312b28;--avena:#3c3531;--topo-claro:#574d46;--topo:#a39588;--topo-hondo:#d9cdc1;--cafe:#f1e9e0;--suave:#bdb0a4;
  --salvia:#3c4739;--salvia-t:#d4e2cd;--rubor:#4d3a37;--rubor-t:#f0d3cd;--cielo:#374449;--cielo-t:#d0e0e7;--mantequilla:#4a412a;--mantequilla-t:#efe0b4;--lavanda:#413b4b;--lavanda-t:#ddd5e8;
  --boton-t:#272220;--sombra:0 1px 2px rgba(0,0,0,.2),0 14px 34px -20px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --lino:#272220;--papel:#312b28;--avena:#3c3531;--topo-claro:#574d46;--topo:#a39588;--topo-hondo:#d9cdc1;--cafe:#f1e9e0;--suave:#bdb0a4;
  --salvia:#3c4739;--salvia-t:#d4e2cd;--rubor:#4d3a37;--rubor-t:#f0d3cd;--cielo:#374449;--cielo-t:#d0e0e7;--mantequilla:#4a412a;--mantequilla-t:#efe0b4;--lavanda:#413b4b;--lavanda-t:#ddd5e8;
  --boton-t:#272220;--sombra:0 1px 2px rgba(0,0,0,.2),0 14px 34px -20px rgba(0,0,0,.6);
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--lino);color:var(--cafe);font:400 16px/1.55 var(--texto);-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--topo-hondo);outline-offset:2px;border-radius:6px}
.app{min-height:100%}
.lateral{max-width:1160px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px clamp(16px,4vw,40px) 8px}
.marca{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.marca svg{width:30px;height:30px;flex:none}
.marca b{display:block;font:500 25px/1 var(--display);letter-spacing:-.01em}
.marca small{display:block;color:var(--suave);font-size:13px;margin-top:3px}
.acciones{display:flex;align-items:center;gap:10px}
.version{color:var(--suave);font-size:12.5px}
.contenido{min-width:0}
.barra{display:none}
.vista{width:100%;max-width:1160px;margin:0 auto;padding:26px clamp(16px,4vw,40px) 64px}
.portada{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,.96fr);gap:clamp(24px,4vw,56px);align-items:start}
.titular{font-size:clamp(34px,4.2vw,50px);letter-spacing:-.018em;max-width:15ch}
.titular em{color:var(--topo)}
.entrada{color:var(--suave);max-width:48ch;margin-top:14px;font-size:17px}
.zona{margin-top:24px;background:var(--papel);border:1.5px dashed var(--topo-claro);border-radius:24px;padding:32px 24px;text-align:center;cursor:pointer;display:block;transition:background .25s,border-color .25s}
.zona:hover{background:var(--avena);border-color:var(--topo)}
.zona svg{width:44px;height:44px;margin-bottom:8px}
.zona strong{display:block;font:400 23px/1.25 var(--display)}
.zona span{color:var(--suave);font-size:14px}
.notas{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.seccion-t{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.seccion-t h2{font-size:26px}.seccion-t span{color:var(--suave);font-size:14px}
.estante{display:grid;gap:12px}
.libro{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--papel);border-radius:18px;padding:14px 16px 14px 14px;box-shadow:var(--sombra);transition:transform .22s;width:100%;cursor:pointer;border:0;text-align:left}
.libro:hover{transform:translateY(-2px)}
.lomo{height:64px;border-radius:5px 9px 9px 5px;position:relative;box-shadow:inset 5px 0 0 rgba(95,82,72,.13)}
.lomo i{position:absolute;left:12px;right:7px;top:14px;height:2px;background:currentColor;opacity:.4;box-shadow:0 7px 0 currentColor}
.libro h3{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libro p{color:var(--suave);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libro-fin{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.mini-accion{border:0;background:var(--topo-hondo);color:var(--boton-t);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;cursor:pointer;min-height:30px}
.minibarra{height:4px;background:var(--avena);border-radius:9px;overflow:hidden;margin-top:6px}
.minibarra i{display:block;height:100%;background:var(--topo)}
.vacio{background:var(--papel);border-radius:22px;padding:28px 26px;box-shadow:var(--sombra)}
.vacio h3{font-size:22px;margin-bottom:6px}.vacio p{color:var(--suave);font-size:15px}
.herramientas{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.herramientas input,.herramientas select{flex:1;min-width:130px;min-height:40px;background:var(--papel)}
.menu{position:relative}
.menu summary{list-style:none;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;cursor:pointer;color:var(--topo-hondo);font-size:20px;line-height:1}
.menu summary::-webkit-details-marker{display:none}
.menu summary:hover{background:var(--avena)}
.menu div{position:absolute;right:0;top:36px;z-index:15;min-width:190px;background:var(--papel);border-radius:14px;padding:6px;box-shadow:0 18px 44px -18px rgba(59,49,42,.6)}
.menu button{display:block;width:100%;min-height:40px;border:0;background:none;text-align:left;border-radius:9px;padding:8px 11px;cursor:pointer;font-size:14.5px}
.menu button:hover{background:var(--avena)}.menu button.peligro{color:var(--rubor-t)}
.libro-fila{display:flex;align-items:center;gap:4px}
dialog.modal{border:0;border-radius:20px;background:var(--papel);color:var(--cafe);padding:22px;width:min(460px,calc(100vw - 32px));box-shadow:0 40px 90px -30px rgba(59,49,42,.55)}
dialog.modal::backdrop{background:rgba(59,49,42,.32)}
dialog.modal h2{font-size:23px;margin-bottom:12px}
.tostada button{margin-left:12px;border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.segmento-ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding-block:12px;border-bottom:1px solid var(--avena)}
.segmento-ed .orig{font:400 15.5px/1.45 var(--display);color:var(--suave);overflow-wrap:anywhere}
.segmento-ed small{display:block;color:var(--suave);font-size:12.5px;margin-bottom:4px}
.segmento-ed textarea{min-height:92px;font:400 16px/1.42 var(--display)}
.pasos{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:12px}
.pasos li{display:grid;grid-template-columns:28px 1fr;gap:12px;font-size:15px}
.pasos b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--avena);font:500 15px var(--display);color:var(--topo-hondo)}
.volver{background:none;border:0;padding:0;color:var(--suave);cursor:pointer;font-size:14px;margin-bottom:14px;min-height:32px}
.volver:hover{color:var(--cafe)}
.visor-barra{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.visor-barra .grupo{display:flex;align-items:center;gap:6px}
.segmento{display:flex;background:var(--avena);border-radius:999px;padding:3px}
.segmento button{border:0;background:none;border-radius:999px;padding:7px 13px;min-height:36px;cursor:pointer;font-size:14px;font-weight:500;color:var(--topo-hondo)}
.segmento button[aria-pressed=true]{background:var(--papel);box-shadow:0 1px 3px rgba(95,82,72,.16)}
.icono{width:40px;height:40px;border:0;border-radius:50%;background:var(--avena);color:var(--topo-hondo);cursor:pointer;font-size:18px;display:grid;place-items:center}
.icono:disabled{opacity:.4;cursor:default}
.visor-barra input[type=number]{width:70px;min-height:40px;background:var(--lino);border:0;border-radius:10px;padding:6px 8px;text-align:center;font-size:15px}
.visor-paginas{display:grid;gap:12px;justify-content:center;overflow:auto;background:var(--avena);border-radius:18px;padding:14px}
.visor-paginas.dos{grid-template-columns:repeat(2,minmax(0,var(--ancho,560px)))}
.visor-paginas.una{grid-template-columns:minmax(0,var(--ancho,700px))}
.hoja{min-width:0}.hoja img{display:block;width:100%;height:auto;border-radius:3px;background:var(--papel);box-shadow:0 8px 24px -14px rgba(59,49,42,.55)}
.hoja small{display:block;text-align:center;color:var(--suave);font-size:12.5px;margin-bottom:5px}
.hoja iframe{display:block;width:100%;height:72vh;border:0;background:#fff;border-radius:3px}
.resultados{display:grid;gap:6px;margin-bottom:12px;max-height:240px;overflow:auto}
.resultados button{border:0;text-align:left;background:var(--lino);border-radius:10px;padding:8px 11px;cursor:pointer;font-size:14px}
.resumen-calidad{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.resumen-calidad button{border:0;cursor:pointer}
.resumen-calidad button[aria-pressed=true]{outline:2px solid var(--topo-hondo)}
.vista-t{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}
.vista-t h1{font-size:clamp(29px,3.4vw,38px);letter-spacing:-.015em}
.vista-t p{color:var(--suave);font-size:14.5px;margin-top:3px}
.ficha{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--avena);color:var(--topo-hondo);white-space:nowrap}
.salvia{background:var(--salvia);color:var(--salvia-t)}.rubor{background:var(--rubor);color:var(--rubor-t)}.cielo{background:var(--cielo);color:var(--cielo-t)}.mantequilla{background:var(--mantequilla);color:var(--mantequilla-t)}.lavanda{background:var(--lavanda);color:var(--lavanda-t)}
.recepcion{display:block;background:var(--papel);border:1.5px dashed var(--topo-claro);border-radius:22px;padding:42px 24px;text-align:center;cursor:pointer;transition:background .25s,border-color .25s}
.recepcion:hover{background:var(--avena);border-color:var(--topo)}
.recepcion svg{width:46px;height:46px;margin-bottom:8px}
.recepcion strong{display:block;font:400 26px/1.2 var(--display)}
.recepcion span{display:block;color:var(--suave);font-size:14.5px;margin-top:4px}
.soltar{position:fixed;inset:0;z-index:30;background:rgba(59,49,42,.42);display:grid;place-items:center;pointer-events:none}
.soltar div{background:var(--papel);border-radius:22px;padding:26px 36px;font:400 26px var(--display)}
.panel{background:var(--papel);border-radius:20px;padding:clamp(18px,3vw,28px);box-shadow:var(--sombra)}
.panel+.panel{margin-top:14px}
.panel h2{font-size:23px;margin-bottom:14px}
.columnas{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:16px;align-items:start}
.columnas .panel+.panel{margin-top:0}
.campo{display:grid;gap:6px;margin-bottom:15px}
.campo label,.etiqueta{font-size:13.5px;font-weight:600;color:var(--topo-hondo)}
.campo small{color:var(--suave);font-size:13px;line-height:1.45}
select,input[type=text],input[type=search],input[type=number],input[type=password],textarea{width:100%;min-height:44px;background:var(--lino);border:1px solid transparent;border-radius:12px;padding:10px 13px;font-size:16px;transition:border-color .2s,background .2s}
select:focus,input:focus,textarea:focus{background:var(--papel);border-color:var(--topo-claro);outline:none}
textarea{min-height:88px;resize:vertical;line-height:1.45}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.motores{display:grid;gap:8px;margin:8px 0 16px}
.motor{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:11px;align-items:center;min-height:56px;background:var(--lino);border-radius:14px;padding:9px 13px;cursor:pointer;border:1.5px solid transparent;transition:border-color .2s,background .2s}
.motor:has(input:checked){border-color:var(--topo);background:var(--papel)}
.motor input{accent-color:var(--topo-hondo);margin:0;width:18px;height:18px}
.motor b{font-weight:600;font-size:15px;display:block}.motor small{color:var(--suave);font-size:13px;display:block;line-height:1.3}
details.plegable{background:var(--lino);border-radius:14px;padding:0 14px;margin-bottom:15px}
details.plegable summary{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;font-size:14.5px;font-weight:600;color:var(--topo-hondo);list-style:none}
details.plegable summary::-webkit-details-marker{display:none}
details.plegable summary::after{content:"+";font:400 22px var(--display);color:var(--topo)}
details[open].plegable summary::after{content:"–"}
details.plegable textarea{background:var(--papel)}
details.plegable .interior{padding-bottom:14px}
.casilla{display:flex;gap:11px;align-items:flex-start;min-height:44px;font-size:15px;margin-bottom:16px;cursor:pointer}
.casilla input{margin-top:4px;width:18px;height:18px;accent-color:var(--topo-hondo);flex:none}
.casilla small{color:var(--suave);display:block;font-size:13px}
.boton{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;background:var(--topo-hondo);color:var(--boton-t);border:0;border-radius:999px;padding:10px 22px;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .2s,opacity .2s;font-size:15px}
.boton:hover{transform:translateY(-1px)}
.boton:disabled{opacity:.5;cursor:not-allowed;transform:none}
.boton.suave{background:var(--avena);color:var(--topo-hondo)}
.boton.linea{background:none;color:var(--topo-hondo);box-shadow:inset 0 0 0 1px var(--topo-claro)}
.boton.ancho{width:100%;min-height:50px;font-size:16px}
.accion-fija{position:sticky;bottom:0;margin:0 -2px;padding:10px 0 2px;background:linear-gradient(to top,var(--papel) 75%,transparent)}
.aviso{border-radius:14px;padding:11px 14px;font-size:14.5px;margin-bottom:13px;line-height:1.48}
.dato{display:flex;justify-content:space-between;gap:12px;padding-block:9px;border-bottom:1px solid var(--avena);font-size:14.5px}
.dato:last-child{border:0}.dato span{color:var(--suave)}.dato b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere;min-width:0}
.cuota{height:8px;background:var(--avena);border-radius:999px;overflow:hidden;margin-top:10px}
.cuota i{display:block;height:100%;background:var(--topo);border-radius:999px}
.terminos{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.terminos button{border:0;cursor:pointer;background:var(--lavanda);color:var(--lavanda-t);border-radius:999px;padding:6px 12px;font-size:13px;min-height:32px}
.progreso{text-align:center}
.cifra{font:400 clamp(60px,10vw,92px)/1 var(--display);color:var(--topo-hondo);font-variant-numeric:tabular-nums}
.barra-p{height:10px;background:var(--avena);border-radius:999px;overflow:hidden;margin:18px auto;max-width:560px}
.barra-p i{display:block;height:100%;background:var(--topo);border-radius:999px;transition:width .6s ease}
.fases{list-style:none;margin:20px auto;padding:0;max-width:420px;text-align:left;display:grid;gap:2px}
.fases li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:center;min-height:40px;color:var(--suave);font-size:15px}
.fases i{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--avena);font:normal 600 13px var(--texto)}
.fases .hecha i{background:var(--salvia);color:var(--salvia-t)}
.fases .activa{color:var(--cafe);font-weight:600}
.fases .activa i{background:var(--mantequilla);color:var(--mantequilla-t)}
.fases .activa i::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;animation:latir 1.4s ease-in-out infinite}
@keyframes latir{50%{opacity:.25}}
.pestanas-libro{display:flex;gap:4px;overflow-x:auto;background:var(--avena);border-radius:999px;padding:4px;width:fit-content;max-width:100%;margin-bottom:16px;scrollbar-width:none}
.pestanas-libro button{border:0;background:none;padding:8px 17px;min-height:38px;border-radius:999px;cursor:pointer;font-weight:500;font-size:14.5px;color:var(--topo-hondo);white-space:nowrap}
.pestanas-libro button[aria-selected=true]{background:var(--papel);box-shadow:0 1px 3px rgba(95,82,72,.16)}
.descargas{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:14px}
.descarga{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:center;text-decoration:none;border-radius:16px;padding:14px;min-height:70px;transition:transform .2s}
.descarga:hover{transform:translateY(-2px)}
.descarga b{display:block;font-size:15px}.descarga small{font-size:13px;opacity:.86}
.descarga svg{width:34px;height:34px}
.fila{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.est-cabeza{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}
.est-meta{font-size:13.5px;color:var(--suave)}
.est-nav{margin-bottom:18px;background:none;padding:0;gap:6px;flex-wrap:wrap;width:auto;overflow:visible}
.est-nav button{background:var(--avena)}.est-nav button[aria-pressed=true]{background:var(--topo-hondo);color:var(--boton-t);box-shadow:none}
.est-nav small{font-size:12px;opacity:.75;margin-left:4px;font-variant-numeric:tabular-nums}
@media (max-width:700px){.est-nav{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%}.est-cabeza .boton{min-height:36px;padding-block:6px;font-size:14px}}
.est-metodos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.est-metodo{background:var(--lino);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.est-metodo h3{font:500 22px/1.2 var(--display);margin:0}.est-metodo p{margin:0;font-size:14.5px;line-height:1.45;color:var(--suave)}
.est-metodo .boton{margin-top:auto;align-self:flex-start}

.tarjeta-e.dorso{background:var(--salvia);color:var(--salvia-t)}.tarjeta-e small{font:400 13px var(--texto);opacity:.8}
.est-acciones{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.est-pregunta{max-width:68ch;font:400 20px/1.38 var(--display);margin:6px 0 14px;overflow-wrap:anywhere}
.est-opciones{display:grid;gap:9px;max-width:68ch}.est-opcion{border:1px solid var(--topo-claro);background:var(--papel);color:inherit;border-radius:12px;padding:12px 14px;min-height:46px;text-align:left;font-size:15.5px;line-height:1.35;cursor:pointer;overflow-wrap:anywhere}
.est-opcion:hover:not(:disabled){background:var(--lino)}.est-opcion:disabled{cursor:default}.est-opcion.bien{background:var(--salvia);color:var(--salvia-t);border-color:transparent}.est-opcion.mal{background:var(--rubor);color:var(--rubor-t);border-color:transparent}
.est-nota{font:500 52px/1 var(--display);margin:6px 0}
.est-desarrollo{padding-block:14px;border-bottom:1px solid var(--avena);max-width:72ch}.est-desarrollo textarea{min-height:92px;margin-block:9px}.est-desarrollo details summary{cursor:pointer;font-weight:500;font-size:14.5px;padding-block:6px}.est-desarrollo details p{line-height:1.5;margin:6px 0 0}

.lista-ideas li::before{content:counter(idea);color:var(--topo);font-style:italic;font-size:21px}
.lista-ideas small{display:block;font:400 13px var(--texto);color:var(--suave);margin-top:3px}

.ajuste a{color:var(--topo-hondo)}

}

<div class="soltar" id="soltar" hidden><div>Suelta aquí tu libro</div></div>

<dialog class="modal" id="modal"></dialog>

<script>
const PASTELES=[["--salvia","--salvia-t"],["--rubor","--rubor-t"],["--cielo","--cielo-t"],["--mantequilla","--mantequilla-t"],["--lavanda","--lavanda-t"]];
const $v=document.getElementById("vista");
const S={ajustes:null,motores:[],idiomas:{},actual:null,pestana:"descargas",temp:null,version:"",opciones:{}};
const num=n=>new Intl.NumberFormat("es-ES",{useGrouping:true}).format(Math.round(n||0));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const color=id=>{let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return PASTELES[h%PASTELES.length]};
const ACTIVOS=["traduciendo","en cola"];
const ETIQUETA={listo:["Por traducir","cielo"],"en cola":["En cola","mantequilla"],traduciendo:["En curso","mantequilla"],terminado:["Traducido","salvia"],pausado:["En pausa","rubor"],detenido:["Detenido","rubor"],error:["Con error","rubor"]};
const ficha=e=>{const[t,c]=ETIQUETA[e]||[e,""];return`<span class="ficha ${c}">${esc(t)}</span>`};
async function api(ruta,op={}){const r=await fetch(ruta,op);let d=null;try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.detail||"No se ha podido completar la operación.");return d}
const post=(ruta,c)=>api(ruta,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(c)});
function tostada(t,accion,fn){const e=document.getElementById("tostada");e.textContent=t;if(accion){const b=document.createElement("button");b.textContent=accion;b.onclick=()=>{e.hidden=true;fn()};e.append(b)}e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,accion?9000:3600)}
const guardado=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem("lumbre."+k));localStorage.setItem("lumbre."+k,JSON.stringify(v))}catch{}return undefined};
function aplicarTema(t){if(t&&t!=="sistema")document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme}
aplicarTema(guardado("tema"));
function pregunta({titulo,cuerpo,aceptar,peligro,alAbrir}){return new Promise(res=>{const d=document.getElementById("modal");d.innerHTML=`<h2>${esc(titulo)}</h2><form method="dialog">${cuerpo}<div class="fila" style="justify-content:flex-end;margin-top:14px"><button type="button" class="boton suave" id="m-no">Cancelar</button><button class="boton" id="m-si" ${peligro?'style="background:var(--rubor-t)"':""}>${esc(aceptar)}</button></div></form>`;document.getElementById("m-no").onclick=()=>{d.close();res(false)};d.querySelector("form").onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));d.close();res(data)};d.showModal();if(alAbrir)alAbrir(d)})}
const bytes=n=>n>1e9?`${(n/1e9).toFixed(1)} GB`:`${Math.round((n||0)/1e6)} MB`;
function marcar(seccion,conPestanas=true,titulo="Lumbre",volver=false){
  document.querySelectorAll("[data-ir]").forEach(b=>{if(b.dataset.ir===seccion)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  document.getElementById("app").classList.toggle("sin-pestanas",!conPestanas);
  document.getElementById("barra-titulo").textContent=titulo;
  document.getElementById("barra-volver").hidden=!volver;
  window.scrollTo(0,0);
}
async function cargarAjustes(){const d=await api("/api/ajustes");S.ajustes=d.ajustes;S.motores=d.motores;S.idiomas=d.idiomas}
const parar=()=>{clearTimeout(S.temp);S.temp=null};

async function biblioteca(){
  parar();S.actual=null;marcar("biblioteca",true,"Lumbre");
  const est=await api("/api/estado").catch(()=>({}));
  S.version=est.version||S.version;document.getElementById("version").textContent=S.version?`Versión ${S.version}`:"";
  if(est.recuperando){$v.innerHTML=`<div class="aviso cielo">Buscando tus libros y ajustes de la versión anterior…</div>`;S.temp=setTimeout(biblioteca,1000);return}
  let libros=[];try{libros=await api("/api/libros")}catch{}
  S.libros=libros;
  const vis=l=>`<span class="ficha salvia">${l}</span>`;
  $v.innerHTML=`<div id="aviso-act"></div><div class="portada"><section>
    <h1 class="titular">Tus libros, en tu idioma y <em>con su forma de siempre</em></h1>
    <p class="entrada">Carga un EPUB o un PDF. Lumbre lo traduce conservando capítulos, estilos, notas e imágenes, y te dice qué merece una segunda lectura.</p>
    <label class="zona" for="selector" tabindex="0"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M8 12c6-3 11-2 16 2v26c-5-4-10-5-16-2V12Z" fill="var(--avena)" stroke="var(--topo-hondo)" stroke-width="1.6" stroke-linejoin="round"/><path d="M40 12c-6-3-11-2-16 2v26c5-4 10-5 16-2V12Z" fill="var(--salvia)" stroke="var(--topo-hondo)" stroke-width="1.6" stroke-linejoin="round"/></svg><strong>Suelta aquí tu libro</strong><span>o pulsa para elegirlo · EPUB o PDF</span></label>
    <div class="notas"><span class="ficha salvia">Visor comparado</span><span class="ficha cielo">Edición bilingüe</span><span class="ficha mantequilla">Resumen por ideas</span><span class="ficha lavanda">Preguntas al libro</span><span class="ficha rubor">Informe de calidad</span></div>
    <div id="error-carga" style="margin-top:14px"></div>
  </section><section>
    <div class="seccion-t"><h2>Tu biblioteca</h2><span>${libros.length?`${libros.length} ${libros.length===1?"libro":"libros"}`:""}</span></div>
    ${est.recuperados?`<div class="aviso salvia">Se han recuperado ${est.recuperados} libros de la versión anterior.</div>`:""}
    ${libros.length>1?`<div class="herramientas"><input type="search" id="b-q" placeholder="Buscar por título o autor" aria-label="Buscar en la biblioteca" value="${esc(S.bq||"")}"><select id="b-orden" aria-label="Ordenar">${[["reciente","Más recientes"],["titulo","Título"],["estado","Estado"]].map(([k,t])=>`<option value="${k}" ${(S.borden||"reciente")===k?"selected":""}>${t}</option>`).join("")}</select></div>`:""}
    ${libros.length?`<div class="estante" id="estante"></div>`:`<div class="vacio"><h3>Aún no hay libros en el estante</h3><p>Así será el primero:</p><ol class="pasos"><li><b>1</b><span>Carga el libro y revisa cuánta cuota necesita.</span></li><li><b>2</b><span>Elige el motor y añade los términos que no deben variar.</span></li><li><b>3</b><span>Léelo en el visor y revisa el informe de calidad.</span></li></ol></div>`}
  </section></div>`;
  pintarEstante();
  const bq=document.getElementById("b-q");if(bq){bq.oninput=()=>{S.bq=bq.value;pintarEstante()};document.getElementById("b-orden").onchange=e=>{S.borden=e.target.value;pintarEstante()}}
  comprobarActualizacion();
  if(libros.some(l=>ACTIVOS.includes(l.estado)))S.temp=setTimeout(biblioteca,4000);
}
function pintarEstante(){
  const c=document.getElementById("estante");if(!c)return;
  const f=tools=>tools.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(),q=f(S.bq||"");
  let lista=S.libros.filter(l=>!q||f(`${l.titulo||l.archivo} ${l.autor||""}`).includes(q));
  const orden=S.borden||"reciente";
  if(orden==="titulo")lista=[...lista].sort((a,b)=>(a.titulo||a.archivo).localeCompare(b.titulo||b.archivo,"es"));
  if(orden==="estado")lista=[...lista].sort((a,b)=>String(a.estado).localeCompare(String(b.estado)));
  c.innerHTML=lista.length?lista.map(tarjeta).join(""):`<p class="vacio-t">Ningún libro coincide con la búsqueda.</p>`;
  c.querySelectorAll("[data-libro]").forEach(b=>{b.onclick=e=>{if(e.target.closest("[data-reanudar],.menu"))return;abrir(b.dataset.libro)};b.onkeydown=e=>{if(e.key==="Enter"&&e.target===b)abrir(b.dataset.libro)}});
  c.querySelectorAll("[data-reanudar]").forEach(b=>b.onclick=async e=>{e.stopPropagation();const id=b.dataset.reanudar;try{const l=await api(`/api/libros/${id}`);await post(`/api/libros/${id}/traducir`,{...(l.opciones||{}),glosario:l.opciones?.glosario_libro??l.opciones?.glosario??"",reanudar:true});abrir(id)}catch(err){tostada(err.message);abrir(id)}});
  c.querySelectorAll("[data-accion]").forEach(b=>b.onclick=e=>{e.stopPropagation();b.closest("details").open=false;accionLibro(b.dataset.accion,S.libros.find(x=>x.id===b.dataset.id))});
}
async function accionLibro(accion,l){
  if(accion==="abrir")return abrir(l.id);
  if(accion==="retraducir"){await abrir(l.id,true);return}
  if(accion==="renombrar"){const r=await pregunta({titulo:"Cambiar datos del libro",aceptar:"Guardar",cuerpo:`<div class="campo"><label for="m-t">Título</label><input type="text" id="m-t" name="titulo" value="${esc(l.titulo||l.archivo)}" required></div><div class="campo"><label for="m-a">Autor</label><input type="text" id="m-a" name="autor" value="${esc(l.autor||"")}"></div>`});if(r){await post(`/api/libros/${l.id}/datos`,r);tostada("Datos guardados");biblioteca()}return}
  if(accion==="borrar"){await borrarLibro(l)}
}
async function borrarLibro(l){
  const r=await pregunta({titulo:"¿Mover a la papelera?",aceptar:"Mover a la papelera",peligro:true,cuerpo:`<p>«${esc(l.titulo||l.archivo)}» se guardará en la papelera 30 días. Lo ya traducido sigue en la memoria.</p>`});if(!r)return;
  try{await api(`/api/libros/${l.id}`,{method:"DELETE"});await biblioteca();tostada("Libro en la papelera","Deshacer",async()=>{await post(`/api/libros/${l.id}/restaurar`,{});biblioteca()})}catch(e){tostada(e.message)}
}
function tarjeta(l){
  const[f,t]=color(l.id);const activo=ACTIVOS.includes(l.estado),puede=["pausado","detenido","error"].includes(l.estado)&&l.opciones?.motor;

function vResumenE(E,c){const m=E.d.material;c.innerHTML=`<div class="est-prosa">${parrafos(m.mega_resumen)}</div>${m.ideas_clave.length?`<h3 class="est-h">Ideas clave</h3><ol class="lista-ideas">${m.ideas_clave.map(x=>`<li><span>${esc(x)}</span></li>`).join("")}</ol>`:""}`}
function vTemasE(E,c){const m=E.d.material;c.innerHTML=m.temas.map((t,i)=>`<details class="est-tema" ${i===0?"open":""}><summary>${esc(t.titulo)}${t.descripcion?`<small>${esc(t.descripcion)}</small>`:""}</summary><div>${t.resumen?`<div class="est-prosa">${parrafos(t.resumen)}</div>`:""}${t.puntos.length?`<div class="etiqueta" style="margin-bottom:9px">Puntos importantes</div><ol class="lista-ideas">${t.puntos.map(p=>`<li><span>${esc(p.texto)}${ref(p)}</span></li>`).join("")}</ol>`:""}</div></details>`).join("")}
function vConceptosE(E,c){const m=E.d.material,sec=(t,xs,f)=>xs.length?`<h3 class="est-h">${t}</h3>${xs.map(f).join("")}`:"";c.innerHTML=sec("Conceptos",m.conceptos,x=>`<div class="est-def"><b>${esc(x.termino)}</b><p>${esc(x.definicion)}</p>${ref(x)}</div>`)+sec("Personas",m.personas,x=>`<div class="est-def"><b>${esc(x.nombre)}</b><p>${esc(x.papel)}</p>${ref(x)}</div>`)+sec("Cronología",m.cronologia,x=>`<div class="est-def"><b>${esc(x.fecha)}</b><p>${esc(x.hecho)}</p>${ref(x)}</div>`)}
function vTarjetasE(E,c){
  const P=E.d.progreso.tarjetas||(E.d.progreso.tarjetas={}),ahora=Date.now(),todas=E.d.material.tarjetas.filter(x=>E.tema===""||String(x.tema)===String(E.tema));
  const debida=x=>!P[x.frente]||P[x.frente].p<=ahora,dominadas=todas.filter(x=>(P[x.frente]?.c||0)>=4).length;
  if(!E.cola){E.cola=mezclar(todas.filter(debida));E.gira=false}
  const x=E.cola[0];
  c.innerHTML=`<div class="est-filtros">${selTema(E)}<p class="est-meta" style="margin:0 0 8px">${E.cola.length} para hoy · ${dominadas} de ${todas.length} dominadas</p></div>${x?`<button class="tarjeta-e ${E.gira?"dorso":""}" id="tj"><span>${esc(E.gira?x.dorso:x.frente)}</span><small>${E.gira?"Respuesta":"Pulsa para ver la respuesta"}</small></button>${E.gira?`<div class="est-acciones"><button class="boton suave" id="tj-no">No la sabía</button><button class="boton" id="tj-si">La sabía</button>${ref(x)}</div>`:""}`:`<div class="aviso salvia">Hoy no quedan tarjetas. Las repetirás cuando toque, para fijarlas mejor.</div><button class="boton suave" id="tj-todas">Repasar todas igualmente</button>`}`;
  document.getElementById("est-tema-s").onchange=e=>{E.tema=e.target.value;E.cola=null;vTarjetasE(E,c)};
  const t=document.getElementById("tj");if(t)t.onclick=()=>{E.gira=!E.gira;vTarjetasE(E,c)};
  const fin=ok=>{const a=P[x.frente]||{c:0},caja=ok?Math.min(5,(a.c||0)+1):1;P[x.frente]={c:caja,p:Date.now()+(ok?DIAS[caja-1]:0)*864e5};E.cola.shift();if(!ok)E.cola.push(x);else if(caja===1)E.cola.push(x);E.gira=false;guardarProgreso(E);vTarjetasE(E,c)};
  const si=document.getElementById("tj-si"),no=document.getElementById("tj-no");if(si){si.onclick=()=>fin(true);no.onclick=()=>fin(false)}
  const to=document.getElementById("tj-todas");if(to)to.onclick=()=>{E.cola=mezclar(todas);vTarjetasE(E,c)};
}
function vTestE(E,c){
  const P=E.d.progreso.test||(E.d.progreso.test={fallos:{},intentos:[]}),m=E.d.material;
  if(!E.t){const fall=m.test.filter(x=>P.fallos[x.pregunta]).length,ult=P.intentos.slice(-1)[0];
    c.innerHTML=`<div class="est-filtros">${selTema(E)}<div class="campo"><label for="t-n">Preguntas</label><select id="t-n"><option>10</option><option>20</option><option>50</option></select></div></div>${ult?`<p class="est-meta" style="margin-bottom:12px">Último intento: ${ult.a} de ${ult.t}.</p>`:""}<div class="fila"><button class="boton" id="t-go">Empezar</button>${fall?`<button class="boton suave" id="t-fall">Repasar falladas · ${fall}</button>`:""}</div>`;
    document.getElementById("est-tema-s").onchange=e=>E.tema=e.target.value;
    const iniciar=xs=>{if(!xs.length){tostada("No hay preguntas para ese tema");return}E.t={q:xs.map(x=>{const orden=mezclar([0,1,2,3]);return{...x,opciones:orden.map(i=>x.opciones[i]),correcta:orden.indexOf(x.correcta)}}),i:0,a:0,r:null,fallos:[]};vTestE(E,c)};
    document.getElementById("t-go").onclick=()=>iniciar(mezclar(m.test.filter(x=>E.tema===""||String(x.tema)===String(E.tema))).slice(0,+document.getElementById("t-n").value));
    const tf=document.getElementById("t-fall");if(tf)tf.onclick=()=>iniciar(mezclar(m.test.filter(x=>P.fallos[x.pregunta])));
    return}
  const T=E.t;
  if(T.i>=T.q.length){const pc=Math.round(T.a/T.q.length*100);c.innerHTML=`<p class="est-nota">${T.a} / ${T.q.length}</p><p class="est-meta" style="margin-bottom:14px">${pc} % de aciertos.</p>${T.fallos.length?`<h3 class="est-h">Para repasar</h3>${T.fallos.map(x=>`<div class="est-def"><b>${esc(x.pregunta)}</b><p>${esc(x.opciones[x.correcta])}. ${esc(x.explicacion)}</p>${ref(x)}</div>`).join("")}`:`<div class="aviso salvia">Todo correcto.</div>`}<div class="est-acciones"><button class="boton" id="t-otro">Otro test</button></div>`;document.getElementById("t-otro").onclick=()=>{E.t=null;vTestE(E,c)};return}
  const x=T.q[T.i];
  c.innerHTML=`<p class="est-meta">Pregunta ${T.i+1} de ${T.q.length}</p><p class="est-pregunta">${esc(x.pregunta)}</p><div class="est-opciones">${x.opciones.map((o,i)=>`<button class="est-opcion ${T.r===null?"":i===x.correcta?"bien":i===T.r?"mal":""}" data-o="${i}" ${T.r===null?"":"disabled"}>${esc(o)}</button>`).join("")}</div>${T.r===null?"":`${x.explicacion?`<p style="max-width:68ch;line-height:1.5;margin:14px 0 4px">${esc(x.explicacion)}</p>`:""}${ref(x)}<div class="est-acciones"><button class="boton" id="t-sig">${T.i+1<T.q.length?"Siguiente":"Ver resultado"}</button></div>`}`;
  c.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{T.r=+b.dataset.o;if(T.r===x.correcta){T.a++;delete P.fallos[x.pregunta]}else{T.fallos.push(x);P.fallos[x.pregunta]=1}vTestE(E,c)});
  const sg=document.getElementById("t-sig");if(sg)sg.onclick=()=>{T.i++;T.r=null;if(T.i>=T.q.length){P.intentos=[...P.intentos,{a:T.a,t:T.q.length,f:Date.now()}].slice(-30);guardarProgreso(E)}else guardarProgreso(E);vTestE(E,c)};
}
function vDesarrolloE(E,c){const P=E.d.progreso.desarrollo||(E.d.progreso.desarrollo={});c.innerHTML=E.d.material.desarrollo.map((x,i)=>`<div class="est-desarrollo"><b style="font:500 19px/1.3 var(--display)">${esc(x.pregunta)}</b><textarea data-i="${i}" aria-label="Tu respuesta" placeholder="Escribe tu respuesta antes de mirar la modelo">${esc(P[x.pregunta]||"")}</textarea><details><summary>Ver respuesta modelo</summary><p>${esc(x.respuesta)}</p>${ref(x)}</details></div>`).join("");c.querySelectorAll("textarea").forEach(t=>t.oninput=()=>{P[E.d.material.desarrollo[+t.dataset.i].pregunta]=t.value;guardarProgreso(E)})}
async function ajustes(){
  parar();S.actual=null;marcar("ajustes",true,"Ajustes");await cargarAjustes();document.getElementById("version").textContent=S.version?`Versión ${S.version}`:"";const a=S.ajustes;
  const bloque=(id,t,x,c)=>`<div class="ajuste"><h3>${t}</h3><p>${x}</p>${c}<div class="resultado" id="pr-${id}"></div></div>`;
  const clave=(k,v,e,m)=>`<div class="fila-clave"><input type="password" id="${k}" aria-label="${e}" autocomplete="off" placeholder="${v?`Guardada (${esc(v)})`:e}"><button type="button" class="boton suave" data-probar="${m}">Probar</button></div>`;
  $v.innerHTML=`<button class="volver" id="volver-a">← Biblioteca</button><div class="vista-t"><div><h1>Ajustes</h1></div></div>
  <section class="panel"><h2>Motores de traducción</h2><p class="vacio-t" style="margin-bottom:12px">Las claves se guardan solo en este ordenador.</p>
  ${bloque("azure","Azure Translator",`2 millones de caracteres gratis al mes con el nivel F0.`,clave("azure_key",a.azure_key,"Clave de Azure","azure")+`<input type="text" id="azure_region" aria-label="Región de Azure" value="${esc(a.azure_region)}" style="margin-top:8px" placeholder="Región, por ejemplo westeurope">`)}
  ${bloque("deepl","DeepL API Free","500.000 caracteres gratis al mes.",clave("deepl_key",a.deepl_key,"Clave de DeepL","deepl"))}
  ${bloque("libre","LibreTranslate","Sin cuota. Requiere tenerlo en marcha en vuestro equipo.",`<div class="fila-clave"><input type="text" id="libre_url" aria-label="Dirección de LibreTranslate" value="${esc(a.libre_url)}"><button type="button" class="boton suave" data-probar="libre">Probar</button></div>`)}
  ${bloque("claude","API de Claude (opcional)","Motor de traducción de pago, aparte de la suscripción.",clave("claude_key",a.claude_key,"Clave de la API de Claude","claude"))}
  <div style="margin-top:14px"><button class="boton" id="guardar">Guardar cambios</button></div></section>
  <section class="panel"><h2>IA para estudiar</h2><p class="vacio-t" style="margin-bottom:12px">Es opcional. Redacta resúmenes, temas y preguntas. Sin ella, Lumbre trabaja con frases literales del libro. Al usar una IA externa, el texto del libro sale de este ordenador hacia ese servicio.</p>
  <div class="campo" style="max-width:320px"><label for="ia_motor">Servicio</label><select id="ia_motor">${[["","Sin IA"],["groq","Groq · gratis, en la nube"],["mistral","Mistral · gratis, en la nube"],["ollama","Ollama · en este ordenador"],["personalizada","Otro compatible con OpenAI"]].map(([k,t])=>`<option value="${k}" ${a.ia_motor===k?"selected":""}>${t}</option>`).join("")}</select></div>
  <div id="ia-campos" style="margin-top:12px"></div><div class="resultado" id="pr-ia"></div>
  <div style="margin-top:14px"><button class="boton" id="guardar-ia">Guardar</button></div></section>
  <section class="panel"><h2>Glosario general</h2><p class="vacio-t" style="margin-bottom:10px">Se aplica a todos los libros nuevos. Una entrada por línea.</p><textarea id="glosario_general" aria-label="Glosario general" placeholder="germ theory = teoría microbiana">${esc(a.glosario_general||"")}</textarea><div style="margin-top:10px"><button class="boton" id="guardar-g">Guardar glosario</button></div></section>
  <section class="panel"><h2>Apariencia</h2><div class="segmento" style="width:fit-content">${[["sistema","Sistema"],["light","Claro"],["dark","Oscuro"]].map(([k,t])=>`<button data-tema="${k}" aria-pressed="${(guardado("tema")||"sistema")===k}">${t}</button>`).join("")}</div></section>
  <section class="panel"><h2>Datos</h2><div id="almacen"></div><div class="fila" style="margin-top:12px"><button class="boton suave" id="abrir-datos">Abrir carpeta de datos</button><button class="boton linea" id="vaciar" hidden>Vaciar papelera</button></div><div id="papelera" style="margin-top:10px"></div></section>
  <section class="panel"><h2>Actualizar Lumbre</h2><p style="margin-bottom:12px">Tienes la versión <b>${esc(S.version)}</b>. La app se renueva sola en unos segundos, sin reinstalar ni perder nada.</p><div id="res-act"></div><div class="fila"><button class="boton" id="buscar-act">Buscar actualizaciones</button><button class="boton suave" id="act">Instalar desde archivo</button></div></section>`;
  document.getElementById("volver-a").onclick=biblioteca;
  const iaInfo={groq:[`Límites diarios con el plan gratuito. Según Groq, no entrena con tus datos por defecto y guarda registros hasta 30 días; el servicio está en EE. UU. Crea la clave en <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com</a>.`,"openai/gpt-oss-120b",true,false],mistral:[`Plan gratuito pensado para probar. Pide teléfono. Mistral avisa de que estas peticiones pueden usarse para entrenar sus modelos: revisa su política antes de usarlo con libros privados. Crea la clave en <a href="https://console.mistral.ai" target="_blank" rel="noopener">console.mistral.ai</a>.`,"mistral-small-latest",true,false],ollama:[`Gratis, privado y sin límites: nada sale del ordenador. Sin tarjeta gráfica es lento. Instálalo desde <a href="https://ollama.com/download" target="_blank" rel="noopener">ollama.com</a> y descarga un modelo, por ejemplo llama3.1:8b con 16 GB de memoria.`,"llama3.1:8b",false,true],personalizada:[`Cualquier servicio compatible con la API de OpenAI. Indica su dirección base y el modelo.`,"",true,true]};
  const camposIA=()=>{const k=document.getElementById("ia_motor").value,c=document.getElementById("ia-campos"),i=iaInfo[k];if(!i){c.innerHTML="";return}const cl=a[`ia_${k}_clave`];c.innerHTML=`<p class="vacio-t" style="margin-bottom:10px">${i[0]}</p>${i[2]?`<div class="campo"><label for="ia-clave">Clave</label><input type="password" id="ia-clave" autocomplete="off" placeholder="${cl?`Guardada (${esc(cl)})`:"Pega aquí la clave"}"></div>`:""}${i[3]?`<div class="campo"><label for="ia-url">Dirección base</label><input type="text" id="ia-url" value="${esc(a[`ia_${k}_url`]||(k==="ollama"?"http://localhost:11434/v1":""))}" placeholder="https://…/v1"></div>`:""}<div class="campo"><label for="ia-modelo">Modelo</label><div class="fila-clave"><input type="text" id="ia-modelo" value="${esc(a[`ia_${k}_modelo`]||i[1])}"><button type="button" class="boton suave" id="probar-ia">Probar</button></div></div>`;document.getElementById("probar-ia").onclick=async()=>{const s=document.getElementById("pr-ia");s.textContent="Probando…";await post("/api/ajustes",recogerIA());const r=await post("/api/ia/probar",{});s.textContent=r.ok?`Funciona: «${r.muestra}»`:r.mensaje}};
  const recogerIA=()=>{const k=document.getElementById("ia_motor").value,c={ia_motor:k};if(iaInfo[k]){const cl=document.getElementById("ia-clave"),u=document.getElementById("ia-url");if(cl&&cl.value.trim())c[`ia_${k}_clave`]=cl.value.trim();if(u)c[`ia_${k}_url`]=u.value.trim();c[`ia_${k}_modelo`]=document.getElementById("ia-modelo").value.trim()}return c};
  document.getElementById("ia_motor").onchange=()=>{document.getElementById("pr-ia").textContent="";camposIA()};camposIA();
  document.getElementById("guardar-ia").onclick=async()=>{await post("/api/ajustes",recogerIA());tostada("Ajustes guardados");ajustes()};
  const recoger=()=>{const c={azure_region:document.getElementById("azure_region").value,libre_url:document.getElementById("libre_url").value};for(const k of["azure_key","deepl_key","claude_key"]){const v=document.getElementById(k).value.trim();if(v)c[k]=v}return c};
  document.getElementById("guardar-g").onclick=async()=>{await post("/api/ajustes",{glosario_general:document.getElementById("glosario_general").value});tostada("Glosario guardado")};
  document.querySelectorAll("[data-tema]").forEach(b=>b.onclick=()=>{guardado("tema",b.dataset.tema);aplicarTema(b.dataset.tema);document.querySelectorAll("[data-tema]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  document.getElementById("abrir-datos").onclick=()=>post("/api/almacenamiento/abrir",{}).catch(e=>tostada(e.message));
  const datos=async()=>{const[al,pa]=await Promise.all([api("/api/almacenamiento"),api("/api/papelera")]);document.getElementById("almacen").innerHTML=`<div class="dato"><span>Libros</span><b>${bytes(al.libros)}</b></div><div class="dato"><span>Memoria de traducciones</span><b>${bytes(al.memoria)}</b></div><div class="dato"><span>Papelera</span><b>${bytes(al.papelera)}</b></div>`;const v=document.getElementById("vaciar");v.hidden=!pa.length;document.getElementById("papelera").innerHTML=pa.map(x=>`<div class="dato"><span>${esc(x.titulo)}</span><button class="boton suave" style="min-height:34px;padding:3px 13px" data-rest="${x.id}">Restaurar</button></div>`).join("");document.querySelectorAll("[data-rest]").forEach(b=>b.onclick=async()=>{await post(`/api/libros/${b.dataset.rest}/restaurar`,{});tostada("Libro restaurado");datos()})};datos();
  document.getElementById("vaciar").onclick=async()=>{const ok=await pregunta({titulo:"¿Vaciar la papelera?",aceptar:"Vaciar",peligro:true,cuerpo:"<p>Los libros se borrarán para siempre. La memoria de traducciones se conserva.</p>"});if(ok){await api("/api/papelera",{method:"DELETE"});datos()}};
  document.getElementById("guardar").onclick=async()=>{await post("/api/ajustes",recoger());tostada("Ajustes guardados");ajustes()};
  document.querySelectorAll("[data-probar]").forEach(b=>b.onclick=async()=>{const id=b.dataset.probar,s=document.getElementById(`pr-${id}`);s.textContent="Probando…";await post("/api/ajustes",recoger());const r=await post(`/api/motores/${id}/probar`,{});s.textContent=r.ok?`Funciona: «${r.muestra}»${r.restante!=null?` · quedan ${num(r.restante)} caracteres este mes`:""}`:r.mensaje});
  document.getElementById("act").onclick=()=>document.getElementById("selector-act").click();
  document.getElementById("buscar-act").onclick=async()=>{const c=document.getElementById("res-act");c.innerHTML=`<div class="aviso cielo">Buscando…</div>`;try{avisoAct=await api("/api/actualizaciones");if(avisoAct.disponible){c.innerHTML=`<div class="aviso cielo fila" style="justify-content:space-between"><span>Versión nueva: <b>${esc(avisoAct.version)}</b></span><button class="boton suave" id="ar2">Actualizar ahora</button></div>`;document.getElementById("ar2").onclick=()=>instalarRemota(c)}else c.innerHTML=`<div class="aviso salvia">Ya tienes la última versión.</div>`}catch(e){c.innerHTML=`<div class="aviso rubor">${esc(e.message)}</div>`}};
}
document.getElementById("selector-act").onchange=async e=>{
  const a=e.target.files[0];e.target.value="";if(!a)return;const s=document.getElementById("res-act");s.innerHTML=`<div class="aviso cielo">Instalando…</div>`;
  const d=new FormData();d.append("file",a);
  try{const r=await api("/api/actualizar",{method:"POST",body:d});
    esperarReinicio(r,s);
  }catch(err){s.innerHTML=`<div class="aviso rubor">${esc(err.message)}</div>`}
};
const latido=()=>fetch("/api/latido",{method:"POST"}).catch(()=>{});latido();setInterval(latido,15000);
biblioteca();
